
<div class="min-h-screen flex items-center justify-center bg-[#f5f5f5] p-5">

  <div class="w-full max-w-md">

    <div class="flex items-center gap-3 text-2xl font-extrabold">
  <img
    src="/imagenes/logo.jpeg"
    alt="Logo de Burguer.ING"
    class="w-20 h-20 mx-auto mb-10 object-cover block lg:hidden"
  />
</div>

    <div class="panel p-8">

      <h1 class="heading-font text-3xl font-extrabold mb-2">
        Crear cuenta
      </h1>

      <p class="text-zinc-500 text-sm mb-6">
        Regístrate para disfrutar de Burguer.ING.
      </p>

      @if (error) {
        <div class="notice notice-error mb-5">
          {{ error }}
        </div>
      }

      <form (ngSubmit)="registrar()" class="space-y-5">

        <div class="form-field">
          <label for="nombre">Nombre completo</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            class="form-control"
            placeholder="Tu nombre"
            [(ngModel)]="nombre"
            required
          />
        </div>

        <div class="form-field">
          <label for="correo">Correo electrónico</label>
          <input
            id="correo"
            name="correo"
            type="email"
            class="form-control"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="correo"
            required
          />
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            placeholder="Mínimo 8 caracteres"
            [(ngModel)]="password"
            required
          />
        </div>

        <div class="form-field">
          <label for="confirmarPassword">Confirmar contraseña</label>
          <input
            id="confirmarPassword"
            name="confirmarPassword"
            type="password"
            class="form-control"
            placeholder="Repite tu contraseña"
            [(ngModel)]="confirmarPassword"
            required
          />
        </div>

        <button
          class="btn btn-red w-full"
          type="submit"
          [disabled]="cargando"
        >
          {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>

      </form>

      <div class="text-sm text-center mt-6 text-zinc-500">
        ¿Ya tienes cuenta?
        <a routerLink="/login" class="font-bold text-red-600">
          Iniciar sesión
        </a>
      </div>

    </div>

  </div>

</div>
